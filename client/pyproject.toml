[project]
name = "wddrop-client"
version = "0.5.1"
description = "Wizardry Daphne drop recorder — reads the game's own messages off your screen"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "wddrop-schema",
]

[project.optional-dependencies]
# Standard mode: screen capture + render-and-compare recognition.
# NOTE: no OCR engine. The vocabulary is closed and the game ships its own fonts, so
# candidates are RENDERED and compared (see capture/glyph.py). That drops ~50MB of model
# weights and, more importantly, makes the instrument identical on every machine — an OCR
# engine whose accuracy varies by installed language packs would put a per-player bias into
# the measurements themselves.
ocr = ["pillow>=10", "numpy>=1.26", "mss>=9.0"]
# Reading the game's WINDOW rather than the screen it is drawn on, so anything in front of
# the game cannot reach the recording. Windows-only and optional: without it capture falls
# back to `mss`, which is what every recording before this was made with.
window = ["windows-capture>=2.0; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
wddrop = "wddrop_client.__main__:main"

[tool.uv.sources]
wddrop-schema = { path = "../packages/schema", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wddrop_client"]
