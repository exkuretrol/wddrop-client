name: release

# Tag a version to publish one:  git tag v0.1.3 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pillow numpy pydantic httpx mss
      # Most tests need the data files or a recording and skip without them. The ones that
      # run here are the ones that need neither, which is still the majority of the logic.
      - run: python -m pytest tests -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The three files the client needs and this repository does not carry:
      #
      #   vocab.<locale>.json     the item names, from the game's own item table
      #   catalog.<locale>.json   the dungeon and floor names, from the game's own assets
      #   atlas.zh_tw.json/.png   the glyphs, rendered from the game's own font
      #
      # All three are derived from the game rather than written here, so they live in a
      # private repository and are fetched only for the length of the build. boosts.json is
      # NOT among them: the client has never read it, it belongs to the server.
      - name: Fetch the data files
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WDDROP_DATA_REPO }}
          token: ${{ secrets.WDDROP_DATA_TOKEN }}
          path: _data
      - name: Put them beside the client
        shell: pwsh
        run: |
          Copy-Item _data\*.json  . -Force
          Copy-Item _data\*.png   . -Force
          Remove-Item _data -Recurse -Force

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller PySide6-Essentials pillow numpy mss pydantic httpx

      - name: Build
        run: python build_exe.py

      # The exe is useless if it cannot find its own data, and that failure does not appear
      # until a player runs it. Checked here, from a folder holding nothing but the exe.
      - name: Check the bundle from an empty folder
        shell: pwsh
        run: |
          python build_exe.py --console --name wddrop-check
          New-Item -ItemType Directory -Force _check | Out-Null
          Copy-Item dist\wddrop-check.exe _check\
          Push-Location _check
          $env:WDDROP_HOME = "$PWD\state"
          .\wddrop-check.exe --selftest | Tee-Object -Variable out
          Pop-Location
          if ($out -notcontains "OK") { throw "the bundled client could not find its own data" }
          Remove-Item dist\wddrop-check.exe, _check -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: wddrop-exe
          path: dist/wddrop.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/wddrop.exe
          body: |
            Download `wddrop.exe` and run it. Nothing to install.

            Play in the tall window (704 × 1241) — the only size that reads reliably today.
            The client already has a calibration for it, so there is nothing to set up.
