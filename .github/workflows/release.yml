name: release

# Tag a version to publish one:  git tag v0.5.2 && git push --tags
# The tag and CLIENT_VERSION must agree — see the check in the `test` job for why.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # THE TAG AND THE BUILD MUST AGREE ABOUT WHICH VERSION THIS IS.
      #
      # Nothing else enforces it: the tag is typed by hand and CLIENT_VERSION is edited by
      # hand, so a release can ship an exe that reports the PREVIOUS version. That used to
      # cost a wrong number in a log. It costs more now — the ingest server refuses uploads
      # from builds below a floor, and the floor is named in these numbers. A build that
      # under-reports itself would be refused after the fix that made it acceptable; one
      # that over-reports would be admitted before it.
      #
      # Checked on tag pushes only, so `workflow_dispatch` still builds whatever is on the
      # branch without a tag having to exist.
      - name: The tag and CLIENT_VERSION must be the same version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          in_code=$(python -c "import re,pathlib;\
          print(re.search(r'CLIENT_VERSION\s*=\s*\"([^\"]+)\"',\
          pathlib.Path('client/wddrop_client/config.py').read_text()).group(1))")
          echo "tag=$tag  CLIENT_VERSION=$in_code"
          if [ "$tag" != "$in_code" ]; then
            echo "::error::tag v$tag would ship a client that calls itself $in_code."\
                 "Bump CLIENT_VERSION in client/wddrop_client/config.py, or retag."
            exit 1
          fi

      - run: pip install pytest pillow numpy pydantic httpx mss
      # Most tests need the data files or a recording and skip without them. The ones that
      # run here are the ones that need neither, which is still the majority of the logic.
      - run: python -m pytest tests -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The files the client needs and this repository does not carry:
      #
      #   vocab.ja.json           the item names, from the game's own item table
      #   catalog.ja.json         the dungeon and floor names, from the game's own assets
      #   names.<locale>.json     those names in the window's language
      #
      # All are derived from the game rather than written here, so they live in a private
      # repository and are fetched only for the length of the build.
      #
      # NOT THE GLYPH ATLAS. It is the game's own typeface rendered, and since client 0.5.0
      # it is not shipped at all: the client builds it on the player's machine from the copy
      # of the game they already have. Only `.json` is copied below, and the atlas pair is
      # deleted afterwards — so a stray copy appearing in the data repository cannot quietly
      # find its way back into a build. boosts.json is excluded for a different reason: the
      # client has never read it, it belongs to the server.
      - name: Fetch the data files
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WDDROP_DATA_REPO }}
          token: ${{ secrets.WDDROP_DATA_TOKEN }}
          path: _data
      - name: Put them beside the client
        shell: pwsh
        run: |
          Copy-Item _data\*.json . -Force
          Remove-Item _data -Recurse -Force
          Remove-Item atlas.*.json, atlas.*.png, boosts.json -ErrorAction SilentlyContinue
          Get-ChildItem *.json | Select-Object -ExpandProperty Name

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ASKED FOR, not listed here. build_exe refuses to build without every name in its
      # RUNTIME_IMPORTS — PyInstaller can only put in the exe what is installed beside it,
      # and a missing one is a capability the player silently does not have: no UnityPy is
      # no atlas built from the game's own font, no windows-capture is capture falling back
      # to the whole screen and reading whatever sits in front of the game.
      #
      # This step used to carry its own copy of that list. The two drifted, and the first
      # build this repository ever ran failed on both of those names.
      - name: Install what the build says it needs
        run: |
          python build_exe.py --requirements > requirements-build.txt
          type requirements-build.txt
          pip install pyinstaller -r requirements-build.txt

      - name: Build
        run: python build_exe.py

      # The exe is useless if it cannot find its own data, and that failure does not appear
      # until a player runs it. Checked here, from a folder holding nothing but the exe.
      - name: Check the bundle from an empty folder
        shell: pwsh
        run: |
          python build_exe.py --console --name wddrop-check
          New-Item -ItemType Directory -Force _check | Out-Null
          Copy-Item dist\wddrop-check.exe _check\
          Push-Location _check
          $env:WDDROP_HOME = "$PWD\state"
          .\wddrop-check.exe --selftest | Tee-Object -Variable out
          Pop-Location
          if ($out -notcontains "OK") { throw "the bundled client could not find its own data" }
          Remove-Item dist\wddrop-check.exe, _check -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: wddrop-exe
          path: dist/wddrop.exe

      # THE RELEASE PAGE SAYS WHAT CHANGED, and says the same thing the changelog does.
      # Taken from CHANGELOG.md rather than generated from the commit log: a generator can
      # only reach what fits in a commit subject, and the line that matters to a player is
      # the one saying which of their recordings a fix affects. Two descriptions of one
      # release would also drift, and the poorer one would be the public one.
      #
      # It FAILS when the version has no section. A release page that quietly says nothing
      # about itself is worse than a build that does not go out.
      - name: Release notes, from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python build_exe.py --release-notes "${GITHUB_REF_NAME#v}" > NOTES.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/wddrop.exe
          body_path: NOTES.md
